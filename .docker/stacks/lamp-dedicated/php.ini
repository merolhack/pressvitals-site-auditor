; Dedicated Server LAMP PHP 8.3 Configuration
memory_limit = 1024M
upload_max_filesize = 256M
post_max_size = 256M
max_execution_time = 600
max_input_time = 600
expose_php = Off
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Dedicated servers typically allow system binaries for maintenance
disable_functions = 

opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 30000
opcache.revalidate_freq = 2
opcache.save_comments = 1
